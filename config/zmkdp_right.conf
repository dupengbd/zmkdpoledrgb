# 右半 (外围) OLED: 运行时可切换动画
# 禁用 CAT 以避免与 selectable 模式重复编译资源
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n

# 屏体与左半同款: 0.96 寸 128x64 (见 boards/.../zmkdp_right/nice_nano_v2.overlay),
# 所以画布尺寸也必须和左半一致 -- 同样竖装, 64 宽 x 160 高。
# 不设的话会用 nice_oled 的默认 68 x 160, 与左半差 4px, 渲染位置对不齐。
CONFIG_NICE_OLED_CUSTOM_CANVAS_WIDTH=64
CONFIG_NICE_OLED_CUSTOM_CANVAS_HEIGHT=160

# 注意: 左半那套 widget(WPM/墨镜猫/图层名/修饰键/配置档点)在 nice_oled 的
# Kconfig 里被 "if !ZMK_SPLIT || ZMK_SPLIT_ROLE_CENTRAL" 包着, 只对中央半存在,
# 外围半不能开。右半的显示内容由 NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_* 决定。
