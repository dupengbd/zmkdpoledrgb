# 左半 (主控) OLED: Bongo Cat 跟随打字速度
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=y

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# 0.96寸 128x64 竖装: 画布 64 宽(铺满屏宽) x 160 高
CONFIG_NICE_OLED_CUSTOM_CANVAS_WIDTH=64
CONFIG_NICE_OLED_CUSTOM_CANVAS_HEIGHT=160

# 顶部一排 (竖直 v≈3): 输出图标靠左, 蓝牙配置号靠右
CONFIG_NICE_OLED_WIDGET_OUTPUT_USB_CUSTOM_X=10
CONFIG_NICE_OLED_WIDGET_OUTPUT_USB_CUSTOM_Y=37
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_CUSTOM_X=10
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_CUSTOM_Y=34
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_UNBONDED_CUSTOM_X=10
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_UNBONDED_CUSTOM_Y=34
CONFIG_NICE_OLED_WIDGET_PROFILE_TEXT_CUSTOM_X=46
CONFIG_NICE_OLED_WIDGET_PROFILE_TEXT_CUSTOM_Y=35

# 电池行 (v≈19), 水平居中 h=17..46
CONFIG_NICE_OLED_WIDGET_BATTERY_CUSTOM_X=20
CONFIG_NICE_OLED_WIDGET_BATTERY_CUSTOM_Y=50

# 墨镜猫: 部件坐标(与画布内容不同): X=竖直(v=96-X), Y=水平(h=Y)
CONFIG_NICE_OLED_WIDGET_BONGO_CAT_CUSTOM_X=68
CONFIG_NICE_OLED_WIDGET_BONGO_CAT_CUSTOM_Y=9

# 修饰键指示 16px 符号 2x2 (v 61..95), 居中 h=15..49
CONFIG_NICE_OLED_WIDGET_MODIFIERS_CUSTOM_X=15
CONFIG_NICE_OLED_WIDGET_MODIFIERS_CUSTOM_Y=92

# 底部图层名 CODE 20px (v 109..125), 居中
CONFIG_NICE_OLED_WIDGET_LAYER_CUSTOM_X=14
CONFIG_NICE_OLED_WIDGET_LAYER_CUSTOM_Y=140

# 配置档指示点组距9px 宽38 (v 100..103) 居中
CONFIG_NICE_OLED_WIDGET_PROFILE_CUSTOM_X=13
CONFIG_NICE_OLED_WIDGET_PROFILE_CUSTOM_Y=131
