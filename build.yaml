---
# 正式固件
include:

  - board: nice_nano_v2
    shield: "zmkdp_left nice_oled"
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: zmkdp_left_with_studio

  - board: nice_nano_v2
    shield: "zmkdp_right nice_oled"
    artifact-name: zmkdp_right_with_oled

#  - board: nice_nano_v2
#    shield: zmkdp_third

# 清蓝牙绑定用：某一半反复重配对都连不上时，先刷这个再刷正式固件。
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: settings_reset

# ---------------------------------------------------------------------------
# 诊断固件：右半当作「中央」(zmkdp_right_as_central)
#
# 正常情况下右半是分体外围 (peripheral)，ZMK 会把 USB HID 协议栈整个编译掉
# （Kconfig: ZMK_USB 依赖 !ZMK_SPLIT || ZMK_SPLIT_ROLE_CENTRAL），所以右半
# 插电脑没反应是设计行为，不是故障。这一版给右半加上 ZMK_SPLIT_ROLE_CENTRAL，
# 让它把自己当主机：单独插电脑即可打字，用来验证右半的 MCU / 矩阵 / 固件
# 是否健康（2026-10 实测可用）。
#
# 注意：刷了这一版后两半互不相认（各自是独立键盘），仅供诊断；
# 验证完请刷回 zmkdp_right_with_oled.uf2。
# ---------------------------------------------------------------------------
  - board: nice_nano_v2
    shield: "zmkdp_right nice_oled"
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
    artifact-name: zmkdp_right_as_central
