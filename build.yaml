---
# 正式固件
#
# Actions 只读这个文件，这里的每一个 include 都是日常要用的固件。
#
# 刷进某半的固件必须与它的角色匹配：
#   左半（中央）  -> zmkdp_left_with_studio.uf2
#   右半（外围）  -> zmkdp_right_with_oled.uf2
#
# 已永久移除：「右半当中央」诊断版（cmake-args 带
# -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y）。2026-10 已确认不再需要编译。
# 千万别再引入 —— 刷了它右半会把自己当主机，两半互不相认，表现为
# 「右半完全没反应」，这个坑已经踩过一次（空口扫描可见右半在广播
# HID 键盘包而不是分体服务）。
# 真需要单独验证右半硬件时，临时加 cmake-args 构建，用完立刻删掉。
include:

  - board: nice_nano_v2
    shield: "zmkdp_left nice_oled"
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: zmkdp_left_with_studio

  - board: nice_nano_v2
    shield: "zmkdp_right nice_oled"
    artifact-name: zmkdp_right_with_oled

#  - board: nice_nano_v2
#    shield: zmkdp_third

# 清蓝牙绑定用：某一半反复重配对都连不上时，先刷这个再刷正式固件。
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: settings_reset

# ---------------------------------------------------------------------------
# 左半日志版：只有中央能开 USB 串口日志（分体外围被编译掉了 USB 协议栈）。
#
# 右半是外围、没有 USB 协议栈，开不了日志；只有左半（中央）能。ZMK v0.3 的
# 默认日志等级就是 DBG，所以只开日志就能看到分体链路全过程：
# 扫描 → 发现 split 服务 → 占用槽位 → 发起连接 → 订阅特征。
# 刷进左半、插 USB，用串口工具看即可（CDC 不分波特率，参数随便）。
#
# 必须用 snippet，不能只写 -DCONFIG_ZMK_USB_LOGGING=y：那个开关会 select
# USB_CDC_ACM/UART_CONSOLE，但它们依赖 DT_HAS_ZEPHYR_CDC_ACM_UART_ENABLED；
# 缺了 cdc-acm-uart 设备树节点，Kconfig 直接 Aborting due to Kconfig warnings。
# snippet 里带的 zmk-usb-logging.overlay 正是加上这个节点。
# ---------------------------------------------------------------------------
  - board: nice_nano_v2
    shield: "zmkdp_left nice_oled"
    snippet: zmk-usb-logging
    artifact-name: zmkdp_left_usb_log
